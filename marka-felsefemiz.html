
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madame Salice | Marka Felsefemiz</title>
  <link rel="icon" type="image/png" href="./bordo%20logo.png">

 



 <style>
   .parsomenler {
  position: absolute;
  top: 49%;
  left: 50%;
  transform: translateX(-50%);
  width: 99%;
  display: flex;
  justify-content: center;
  gap: 2%;
  opacity: 0.05;
  pointer-events: none;
  z-index: 2;
}

.parsomenler img {
  display: block;
  width: 40%;
  height: auto;
}
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f5efe5;
    }

    .page {
      position: relative;
      width: 100%;
    }

    .background-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .watermark-logo {
      position: absolute;
      top: 17%;
      left: 35%;
      transform: translate(-50%, -50%);
      width: 60%;
      max-width: 950px;
      height: auto;
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
    }
   
.parsom-kart {
  position: relative;
  width: 40%;
  flex-shrink: 0;
}

.parsom-kart > img {
  display: block;
  width: 100%;
  height: auto;
}

.parsom-yazi {
  position: absolute;
  top: 30%;
  left: 18%;
  width: 64%;
  text-align: center;
  color: #590f1c;
  opacity: 5;
}

.parsom-yazi h2 {
  margin: 0 0 12px;
  font-family: "Montserrat", sans-serif;
  font-size: clamp(13px, 1.5vw, 22px);
  font-weight: 600;
  letter-spacing: 1px;
}

.parsom-yazi p {
  margin: 0;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(11px, 1.1vw, 16px);
  font-style: italic;
  font-weight: 400;
  line-height: 1.45;
}

  </style>
</head>

<body>
  <main class="page">
    <img
      class="background-image"
      src="./felsefe-arka-plan.png"
      alt=""
    >

    <img
      class="watermark-logo"
      src="./bordo%20logo.png"
      alt=""
    >


<div class="parsomenler">

  <div class="parsom-kart">
    <img src="./parsomen.png" alt="">
    <div class="parsom-yazi">
      <h2>LIBERA</h2>
      <p>Metnini buraya yaz.</p>
    </div>
  </div>

  <div class="parsom-kart">
    <img src="./parsomen.png" alt="">
    <div class="parsom-yazi">
      <h2>FORTE</h2>
      <p>Metnini buraya yaz.</p>
    </div>
  </div>

  <div class="parsom-kart">
    <img src="./parsomen.png" alt="">
    <div class="parsom-yazi">
      <h2>VERA</h2>
      <p>Metnini buraya yaz.</p>
    </div>
  </div>

</div>

    

  </main>
</body>
</html>
