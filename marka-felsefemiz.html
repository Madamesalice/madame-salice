
<!DOCTYPE html>
<html lang="tr">
<head>
  <audio id="madameMusic" loop preload="auto">
  <source src="./madame-salice-ambience.mp3" type="audio/mpeg">
</audio>

<button id="musicToggle" type="button"
  style="position:fixed;top:18px;right:18px;z-index:99999;
  background:#590f1c;color:#fffaf2;border:1px solid #b6975b;
  border-radius:30px;padding:12px 18px;cursor:pointer;
  font-family:'Montserrat',sans-serif;font-size:11px;">
  ♫ Müziği başlat
</button>

<script>
  const music = document.getElementById("madameMusic");
  const toggle = document.getElementById("musicToggle");

  music.volume = 0.22;

  async function startMusic() {
    try {
      await music.play();
      toggle.textContent = "♫ Müziği durdur";
    } catch (error) {
      toggle.textContent = "♫ Müziği başlat";
    }
  }

  startMusic();

  toggle.addEventListener("click", async () => {
    if (music.paused) {
      await startMusic();
    } else {
      music.pause();
      toggle.textContent = "♫ Müziği başlat";
    }




.kesfet-alani {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 55px 20px 65px;
  position: relative;
  z-index: 20;
}

.kesfet-butonu {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 17px 30px;
  border: 1px solid #b6975b;
  background: #fffaf2;
  color: #590f1c;
  text-decoration: none;
  font-family: "Montserrat", sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 2px;
  transition: background 0.3s ease, color 0.3s ease;
}

.kesfet-butonu span {
  font-size: 18px;
  transition: transform 0.3s ease;
}

.kesfet-butonu:hover {
  background: #590f1c;
  color: #fffaf2;
}

.kesfet-butonu:hover span {
  transform: translateX(5px);
}

@media (max-width: 600px) {
  .kesfet-alani {
    padding: 35px 16px 45px;
  }

  .kesfet-butonu {
    padding: 15px 18px;
    font-size: 9px;
    letter-spacing: 1.3px;
  }
}
