
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Madame Salice | Marka Felsefemiz</title>

  <link rel="icon" type="image/png" href="./bordo%20logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f5efe5;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
    }

    .background-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .watermark-logo {
      position: absolute;
      top: 17%;
      left: 35%;
      transform: translate(-50%, -50%);
      width: 60%;
      max-width: 950px;
      height: auto;
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
    }

    /* PARŞÖMENLER */

    .parsomenler {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translateX(-50%);
      width: 99%;
      display: flex;
      justify-content: center;
      gap: 2%;
      opacity: 1;
      pointer-events: none;
      z-index: 2;
    }

    .parsom-kart {
      position: relative;
      width: 32%;
      flex-shrink: 0;
    }

    .parsom-kart > img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0.08;
    }

    .parsom-yazi {
      position: absolute;
      z-index: 10;
      top: 10%;
      left: 18%;
      width: 64%;
      text-align: center;
      color: #590f1c;
      opacity: 1;
    }

    .parsom-yazi h2 {
      margin: 0 0 14px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(20px, 2vw, 33px);
      font-weight: 500;
      font-style: normal;
      letter-spacing: 1px;
      line-height: 1.1;
      color: #590f1c;
      text-transform: uppercase;
    }

    .parsom-yazi p {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(12px, 1.5vw, 16px);
      font-style: italic;
      font-weight: 400;
      line-height: 1.45;
    }

    /* KEŞFET BUTONU */

    .kesfet-alani {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 55px 20px 65px;
      position: relative;
      z-index: 20;
    }

    .kesfet-butonu {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 17px 30px;
      border: 1px solid #b6975b;
      background: #fffaf2;
      color: #590f1c;
      text-decoration: none;
      font-family: "Montserrat", sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-align: center;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .kesfet-butonu span {
      font-size: 18px;
      transition: transform 0.3s ease;
    }

    .kesfet-butonu:hover {
      background: #590f1c;
      color: #fffaf2;
    }

    .kesfet-butonu:hover span {
      transform: translateX(5px);
    }

    /* MÜZİK BUTONU */

    .music-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 99999;
      background: #590f1c;
      color: #fffaf2;
      border: 1px solid #b6975b;
      border-radius: 30px;
      padding: 12px 18px;
      cursor: pointer;
      font-family: "Montserrat", sans-serif;
      font-size: 11px;
    }

    .music-toggle:hover {
      background: #7a1a2a;
    }

    /* MOBİL UYUMLULUK */

    @media (max-width: 600px) {
      .parsomenler {
        top: 49%;
        width: 99%;
        gap: 1%;
      }

      .parsom-kart {
        width: 32.66%;
      }

      .parsom-yazi {
        top: 12%;
        left: 10%;
        width: 80%;
      }

      .parsom-yazi h2 {
        font-size: clamp(13px, 3.2vw, 20px);
        margin-bottom: 6px;
        letter-spacing: 0.5px;
      }

      .parsom-yazi p {
        font-size: clamp(8px, 1.8vw, 11px);
        line-height: 1.25;
      }

      .kesfet-alani {
        padding: 35px 16px 45px;
      }

      .kesfet-butonu {
        padding: 15px 18px;
        font-size: 9px;
        letter-spacing: 1.3px;
        gap: 10px;
      }

      .music-toggle {
        top: 12px;
        right: 12px;
        padding: 10px 13px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- MÜZİK -->
  <audio id="madameMusic" loop preload="auto">
    <source src="./madame-salice-ambience.mp3" type="audio/mpeg">
  </audio>

  <button
    id="musicToggle"
    class="music-toggle"
    type="button"
    aria-label="Arka plan müziğini başlat veya durdur"
    aria-pressed="false">
    ♫ Müziği başlat
  </button>

  <main class="page">

    <!-- ARKA PLAN -->
    <img
      class="background-image"
      src="./felsefe-arka-plan.png"
      alt="Madame Salice marka felsefesi arka planı">

    <!-- SOLUK LOGO -->
    <img
      class="watermark-logo"
      src="./bordo%20logo.png"
      alt=""
      aria-hidden="true">

    <!-- ÜÇ PARŞÖMEN -->
    <div class="parsomenler">

      <div class="parsom-kart">
        <img src="./parsomen.png" alt="">
        <div class="parsom-yazi">
          <h2>LIBERA</h2>
          <p>Metnini buraya yaz.</p>
        </div>
      </div>

      <div class="parsom-kart">
        <img src="./parsomen.png" alt="">
        <div class="parsom-yazi">
          <h2>FORTE</h2>
          <p>Metnini buraya yaz.</p>
        </div>
      </div>

      <div class="parsom-kart">
        <img src="./parsomen.png" alt="">
        <div class="parsom-yazi">
          <h2>VERA</h2>
          <p>Metnini buraya yaz.</p>
        </div>
      </div>

    </div>

    <!-- ANA SAYFAYA DÖNÜŞ -->
    <div class="kesfet-alani">
      <a href="./index.html" class="kesfet-butonu">
        MADAME SALICE DÜNYASINI KEŞFET
        <span aria-hidden="true">→</span>
      </a>
    </div>

  </main>

  <script>
    const music = document.getElementById("madameMusic");
    const toggle = document.getElementById("musicToggle");

    music.volume = 0.22;

    toggle.addEventListener("click", async () => {
      if (music.paused) {
        try {
          await music.play();
          toggle.textContent = "♫ Müziği durdur";
          toggle.setAttribute("aria-pressed", "true");
        } catch (error) {
          toggle.textContent = "♫ Müziği başlat";
          toggle.setAttribute("aria-pressed", "false");
        }
      } else {
        music.pause();
        toggle.textContent = "♫ Müziği başlat";
        toggle.setAttribute("aria-pressed", "false");
      }
    });
  </script>

</body>
</html>
