
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madame Salice | Marka Felsefemiz</title>
  <link rel="icon" type="image/png" href="./bordo%20logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f5efe5;
    }

    .page {
      position: relative;
      width: 100%;
    }

    .background-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .watermark-logo {
      position: absolute;
      top: 17%;
      left: 75%;
      transform: translate(-50%, -50%);
      width: 50%;
      max-width: 800px;
      height: auto;
      opacity: 0.35;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>

<body>
  <main class="page">
    <img
      class="background-image"
      src="./felsefe-arka-plan.png"
      alt=""
    >

    <img
      class="watermark-logo"
      src="./bordo%20logo.png"
      alt=""
    >
  </main>
</body>
</html>
