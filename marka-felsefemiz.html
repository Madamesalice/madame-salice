
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madame Salice | Marka Felsefemiz</title>
  <link rel="icon" type="image/png" href="./bordo%20logo.png">

 



 <style>
  
.parsomenler {
  position: absolute;
  top: 49%;
  left: 50%;
  transform: translateX(-50%);
  width: 99%;
  display: flex;
  justify-content: center;
  gap: 2%;
  opacity: 1;
  pointer-events: none;
  z-index: 2;
}

.parsomenler img {
  display: block;
  width: 100%;
  height: auto;
}

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f5efe5;
    }

    .page {
      position: relative;
      width: 100%;
    }

    .background-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .watermark-logo {
      position: absolute;
      top: 17%;
      left: 35%;
      transform: translate(-50%, -50%);
      width: 60%;
      max-width: 950px;
      height: auto;
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
    }
   

.parsom-kart {
  position: relative;
  width: 32%;
  flex-shrink: 0;
}


.parsom-kart > img {
  display: block;
  width: 100%;
  height: auto;
}

.parsom-yazi {
  position: absolute;
  z-index: 10;
  top: 12%;
  left: 18%;
  width: 64%;
  text-align: center;
  color: #590f1c;
  opacity: 1;
}


.parsom-yazi h2 {
  margin: 0 0 14px;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(20px, 2vw, 33px);
  font-weight: 500;
  font-style: normal;
  letter-spacing: 1.5px;
  line-height: 1.1;
  color: #590f1c;
  text-transform: uppercase;
}


.parsom-yazi p {
  margin: 0;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(10px, 1vw, 14px);
  font-style: italic;
  font-weight: 400;
  line-height: 1.45;
}

.parsom-kart > img {
  opacity: 0.08;
}

  </style>
</head>

<body>
  <main class="page">
    <img
      class="background-image"
      src="./felsefe-arka-plan.png"
      alt=""
    >

    <img
      class="watermark-logo"
      src="./bordo%20logo.png"
      alt=""
    >


<div class="parsomenler">

  <div class="parsom-kart">
    <img src="./parsomen.png" alt="">
    <div class="parsom-yazi">
      <h2>LIBERA</h2>
      <p>Metnini buraya yaz.</p>
    </div>
  </div>

  <div class="parsom-kart">
    <img src="./parsomen.png" alt="">
    <div class="parsom-yazi">
      <h2>FORTE</h2>
      <p>Metnini buraya yaz.</p>
    </div>
  </div>

  <div class="parsom-kart">
    <img src="./parsomen.png" alt="">
    <div class="parsom-yazi">
      <h2>VERA</h2>
      <p>Metnini buraya yaz.</p>
    </div>
  </div>

</div>

    

  </main>
</body>
</html>
